- q: Which planets on cluster borders are adjacent or not to each other?
  a: The planets on the borders of clusters 5 and 6 as well as the planets bordering clusters 2 and 3 are adjacent, unlike the other clusters with irregular borders.
  rules:
    - '4.3.2.2'

- q: Do I resolve hits simultaneously and then Provoke Outrage, or do I resolve them one by one?
  a: >
    Resolve all of your hits, remove all pieces, then Provoke Outrage. If you destroyed multiple cities, resolve Outrage 
    and Ransack for the first city before Outrage, then Ransack for the next. In the campaign, resolve all hits first
    before resolving effects that trigger from **harm**.
  rules:
 
  - q: Do I still deal all hits to the defender if all my attacking ships are destroyed?
  a: >
    Yes. The only penalty is the inability to raid if your ships are all destroyed.
   - '7.7.1.4'

  - q: May I still raid if all defending buildings are destroyed?
  a: >
    Yes.
   - '7.7.1.4'
   
- q: Can I Cede Control while I am a Flagship?
  a: You can Cede Control of buildings on the map, but not buildings on your Flagship, and not your Flagship itself. Other players can also Cede buildings to you.
  rules:
    - '17.2.1.1'
    
- q: In a 2 player game, how many ships go in 1C and 2C?
  a: 2 in each system. (Some Leaders place different amounts in those systems. Still place that amount in each C system).
  rules:
    - '3.1.2.3'

- q: If I have more than two resource slots open, can I put my starting resources in different slots?
  a: No. They always go in your two leftmost slots.
  rules:
    - '3.1.2.4'

- q: When a rule lets me use a building 'like they are Loyal,' what does this mean?
  a: >
    This is a shorthand that essentially means 'you do not need to control the buildings' and in the case of taxing 
    'you don't take a Captive.' Other cards may refer to abilities you can do with Loyal buildings, but those abilities 
    do not apply to buildings you are using 'like they are Loyal.' (i.e. You cannot use Living Structures to replace a 
    building that you are only treating like it is Loyal. This ability only applies to buildings that are actually Loyal.)
  rules:
    - '23.1.15'

- q: Do I have to use all the pips on my action card?
  a: Nope! For example, if you have 3 action pips, you could take only 1 action.
  rules:
    - '5.'

- q: If I convert a standard action into a new action, do modifiers of the standard action apply?
  a: >
    Nope! Action modifiers only change the listed standard action. However, if a new action __contains__ a standard action, 
    then modifiers of that standard action apply, unless explicitly ignored (e.g., Force Beams).
  rules:
    - '8.2'

- q: When a card says 'when you Copy or Pivot to' do a specific action, what triggers this?
  a: >
    Only spending the card pip to Copy or Pivot for that action. It does not trigger from Prelude actions.<br>
    An ability that says “When you Copy or Pivot to battle” does trigger if you spent a Weapon to let you battle from your 
    Copy or Pivot action pip.<br>
    You can trigger the ability if you Copy or Pivot to use a new action containing the listed standard action. For example, 
    the Nurture action on Living Structures contains the Tax action, so if you took the Nurture action with a Copy or Pivot, 
    it would trigger an ability that says “If you Copy or Pivot to tax…”
  rules:
    - '5.2.2'

- q: Can I tax a city even if there are no resources of its type to tax?
  a: Yes. For example, you could still gain a Captive by taxing a Rival city in this way.
  rules:
    - '7.1'

- q: If I choose to collect fewer dice than the maximum, are those ships still 'in the battle' and can they take hits?
  a: Yes. All your Loyal ships are attacking ships and can take hits from self-hits and intercepts.
  rules:
    - '7.7.1.3'

- q: Can I attempt to battle somewhere even without a legal defender?
  a: No.
  rules:
    - '7.7'

- q: Can I attempt to secure a card even without a legal target?
  a: No.
  rules:
    - '7.6'

- q: When exactly do I need to stop with a Catapult move?
  a: > 
    When you reach a planet (regardless of control) or a gate that is controlled 
    by a Rival (counted just before your ships move in). As long as you have not 
    stopped, you may backtrack while dropping off ships. For example, you could 
    Catapult from a planet in cluster 3, drop ships off in gate 3, then in gate 4, 
    then finally stop at a planet in cluster 3.
  rules:
    - '7.3.2'

- q: Can you summarize the whole turn structure?
  a: > 
    Here is the turn structure:<br>
    1. Play an action card.<br>
    2. If you're leading, you may declare an ambition. If you're not leading, you may seize the initiative.<br>
    (In rare situations where you can do both, you may declare and seize in either order.) <br>
    3. Prelude window begins. You may use the Prelude actions of cards and resources.<br>
    4. Prelude window ends. Return spent resources to the supply.<br>
    5. Perform actions by spending action pips from your played card.<br><br>

  rules:
    - '5.'

- q: In my Prelude, can I regain a resource that I spent in my Prelude? 
  a: No. Resources only return to their supplies at the end of Prelude.
  rules:
    - '9.1'

- q: Can I use *non*-Prelude actions on cards that I secured from the Court during my current Prelude?
  a: Yes!
  rules:
    - '8.1.2'

- q: Can I use Prelude actions on cards in the same Prelude I gained them if I took them from places other than the Court?
  a: Yes! For example, if you stole a card using Silver-Tongues, you could immediately use it.
  rules:
    - '8.1.2'

- q: Is seizing mandatory if I Surpass with a '7' card?
  a: Yes. As normal, though, you cannot seize the initiative if someone else already did this round.
  rules:
    - '5.2.3'

- q: Can I spend resources in my Prelude without effect?
  a: Yes, even if you have Outrage of the resource types.
  rules:
    - '9.1'

- q: Can I rearrange resources when I lose a resource?
  a: No, only when gaining.
  rules:
    - '9.2.1'

- q: When I spend a resource for an action, can I also spend a Weapon to change this action to battle?
  a: No. Weapons only let you modify actions you take from your action card pips.
  rules:
    - '9.1'

- q: To be clear, does Provoking Outrage discard anything I take from Ransacking the Court or raiding in the same battle?
  a: Nope!
  rules:
    - '7.7.4'

- q: How strict do I need to be with this rule?
  a: >
      In theory, once you spend an action pip from the played action card, you cannot use any more Prelude actions. 
      In practice, as long as your actions do not reveal new information (e.g., battle/secure), it is fine to rewind 
      to the Prelude.

      Some players might not consent to an undo. For example, if the acting player is collaborating with another player 
      or kingmaking, rewinding can effectively reveal private information to the table, giving advantage to the 
      person they are helping. For example, playing an action card reveals the card to other players, but the acting 
      player does not gain new info, so it can be undone with the consent of the table.

  rules:
    - '8.1.1'

- q: Are the lore cards secret or known before shuffling them in?
  a: >
      They are secret.
  rules:
    - '3.2.1.10'

- q: Can I give away frozen resources or protected Guild cards?
  a: >
      No. You cannot even be forced to give them away with a returned Favor.
  rules:
    - '17.2.1.4'

- q: Can anyone force an Outlaw to join the Empire in this way?
  a: >
      No. This action can only be forced by an Outlaw returning the First Regent's Favor in the Call to Order, forcing the First Regent to target 
      that Outlaw with the action, causing that Outlaw to become a Regent.
  rules:
    - '17.2.1.5'
 
- q: Can I see a summary of ending a chapter in the Blighted Reach campaign?
  a: >
          **1. Score Ambitions**<br>
          a. Resolve effects that happen **at the start of scoring**.<br>
          b. Score ambitions. (In Act 3, also score grand ambitions.)<br>
          c. Advance objectives that happen **at the end of a chapter**.<br>
          d. Resolve effects that happen **after scoring**. If more than one needs to be resolved, the player with the initiative decides their order.<br>
          **2. Clean Up & Flip Ambition Marker**<br>
          **3. End Game or Advance Chapter**<br>
          a. If any final objectives are met, the game ends.<br>
          b. If it was the last chapter, the game ends.<br>
          c. Resolve effects that happen **at end of game**.<br>
          d. Advance the chapter marker.<br>
          **4. Draw Cards**
  rules:
    - '6.'

- q: Do my frozen resources count as 'resources I have' for the purpose of [Monopolies](https://cards.buriedgiantstudios.com/card/ARCS-F318), etc.?
  a: >
      Yes!
 - q: Can Rival take and steal frozen resources?
  a: >
      Yes, including for the Imperial Demand. (This was stated in the original rulebook, and is still true by implication. 
      A First Regent who has the frozen resource, however, cannot take those resources for the Demand. 
      The restriction applies to the resource's holder, not their Rivals. 
  rules:
    - '13.3.1'

- q: Can I attach a card to the Imperial Council while it's on its Decided side? Including if it's in the card play area?
  a: >
      Yes! The Council only leaves the Court as a reminder when you secure it. It's technically still there.
  rules:
    - '13.2'

- q: What happens if I need to place my Flagship but I have no ships on the map?
  a: >
      Place 3 ships in any gate during step D of the Intermission (`rule:21.4`).
  rules:
    - '20.1.1'

- q: Do I build Upgrades and Armor damaged if someone else controls my Flagship's system?
  a: >
      Yes!
  rules:
    - '20.3.1'

- q: If I can put resources on a card, is it in a "resource slot?"
  a: >
      Yes, other than for Cartels or Monopolies that hold supplies. These cards that "hold" or let you "place" resources 
      on them effectively “have resource slots” reserved only for those resources. This is mostly relevant for 
      interactions with Golems, particularly the Golem Hearth, or the Pirate Hoard.
  rules:
    - '9.3.1'

- q: What happens if an effect tells me to replace, but I can't either return and/or place the corresponding pieces?
  a: >
      You don't do anything to the piece. You cannot replace if the targeted piece cannot be removed, and/or if the 
      corresponding supply to place a piece from is empty.
  rules:
    - '22.3.5'

- q: What are some examples of multiple things happening at the same time that must be resolved in order?
  a: >
        - After rolling dice in battle: Skirmishers and Empath’s Vision<br>
        - After a battle: Repair Drones and the Quartermaster’s Resilient ability
  rules:
    - '22.1.2'
    
- q: If I wish to trigger build modifiers, can I build even if the corresponding building or ship supply is empty?
  a: >
     Yes, since you do the maximum possible when you can't place enough pieces ('rule:22.3.4').
  rules:
    - '7.2.1'

- q: It looks like several keywords (steal, gain, and give) also add a piece to my play area. Are these all considered a form of 'take' as well?
  a: >
     Yes, stealing, gaining and giving overlap with you "taking" the piece for the purposes of cards or rules that mention it.
  rules:
    - '23.1.30'

- q: Do you refill the Council's slot with a newly drawn card when it is secured? What about sliding down an attached card?
  a: >
     No to both. It does not technically leave the Court at all; it only leaves as a reminder.
  rules:
    - '16.3.3'

- q: Can you advance your objective below 0, into the negatives?
  a: >
     No. You can only advance "toward" zero.
  rules:
    - '12.5.1'
    
- q: Who decides what resource each Regent contributes to the Imperial Demand if they have more than 1 resource that could fulfill it?
  a: >
     For each Regent, the First Regent alone decides which resource to take from any slot. They can take a different resource 
     type for each Regent. When enforcing the Policy of Peace, for example, the First Regent can take a Relic from a Regent with a 
     Relic and a Psionic, then take any Psionic from another Regent who has 2 Psionics.
  rules:
    - '19.2'

- q: Can I take, give, or steal a resource directly from a supply, including a supply held on a Cartel or a Monopoly in the campaign?
  a: >
     No. Gain is the only keyword that lets you add a piece to your play area directly from a supply.
  rules: 
    - '23.1.12'

- q: Exactly which card (or cards) can I (or must I) secure with Ransack?
  a: >
     You must secure exactly 1 card with at least 1 of the Rival's agents (if such a card exists), even if you do not have the most agents on the card.
  rules: 
    - '7.7.4.2'

- q: When exactly is an attachment "forced"?
  a: >
      An attach is forced when an automatic effect like an Edict or Crisis causes a card to attach, without giving players
     a choice not to attach. Conversely, when a player chooses to resolve an effect whose text includes attaching a card,
     that is not forced. Therefore, the Claims of Nobility Crisis is a forced attach, but its When Secured action is not. 
     The first requirement to ignore is the requirement to attach to a card that has no attached cards. Thus, when forced,
     you attach a second card to the card with an attached card.
  
  - q: What exactly is meant here by "ignoring the fewest requirements to attach it"?
  a: >
     To date, all forced attachments are resolved by ignoring the rule that you attach to a card without a previously attached card.
     Therefore, when forced to attach to a card that already has an attached card, simply attach the new card as a second attachment.
  rules: 
    - '13.2.3'
    
  - q: Does this mean I can or must conceal how many cards are in my hand?
  a: >
     No. It only prevents revealing the face of your action cards, not their backs or how many you have. Card backs in your hand
     are important public information in the campaign. 
   - q: Does this imply everything else not face down or in a deck is public information?
  a: >
     Yes, unless otherwise specified.
    - '22.6.1'

  - q: Do damaged buildings still perform actions like taxing or building ships?
  a: >
      Yes. Those rules are not restricted to fresh pieces.
    - '4.6.2'

  - q: Do I still flip ambition markers between chapters in the campaign.
  a: >
      Yes. This does not change that rule at all.
    - '3.3.1'
