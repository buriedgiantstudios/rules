- name: Components
  color: '#000000'
  pretext: >
    These are all of the components used in Oath: New Foundations. **Before continuing, you must set up the box as described at the start of the Welcome to New Foundations booklet. Please read it first!**
  children:
    - name: The Map
      pretext: The map of this land holds many sites, the world and relic decks, the banks of favor tokens you will take from as you play, and various tracks.

    - name: 7 Player Boards (Double-Sided)
      pretext: Every player begins as an Exile, leaders of subjugated peoples who seek to regain a voice in society. In later games, they might become Citizens, flipping their board.

    - name: Chancellor Board
      pretext: In later games, one player will be the Chancellor, ruler of the Empire. They hope to keep hold on power and pass on their authority to their descendants.

    - name: 8 Pawns, Each of a Different Color
      pretext: Your pawn is the character you're playing. Most of the time, you take actions at the site where your pawn is.

    - name: 122 Warbands (24 Purple, 14 Each of Seven Colors)
      pretext: Warbands are your loyal followers that you'll use to campaign against your enemies and rule sites.

    - name: 24 Bandit Warbands
      pretext: These warbands rule sites that are not ruled by a player.

    - name: 10 Attack Dice, 6 Defense Dice, 1 End Die, and 10 Track Markers
      pretext: These decide the fate of uncertain actions and track play. The dice are not limited by the amount in the box.

    - name: 36 Favor Tokens
      pretext: Favor represents your influence with the various denizens of this land.

    - name: 20 Secret Tokens
      pretext: Secrets represent your knowledge of ancient truths or well-cloaked lies.

    - name: 12 x3 Favor

    - name: 12 x3 Secrets

    - name: Banner of the Darkest Secret (Double-Sided)
      pretext: This banner represents your mysterious aura that intrigues and seduces everyone.

    - name: Banner of the People's Favor (Double-Sided)
      pretext: This banner represents the support for your mission from all around the land.

    - name: Oathkeeper Title (Double-Sided)
      pretext: The player who currently fulfills the Oathkeeper goal holds this title. If an Exile holds this title long enough, they win the game.

    - name: 4 Oathkeeper Goals (Double-Sided)
      pretext: Each game has one of four Oathkeeper goals, showing one way to win. In games with Citizens, the Successor goal on the bottom shows how Citizens can win.

    - name: Grand Scepter Relic
      pretext: The Chancellor starts with this relic, which gives them the power to turn Exiles into Citizens and to exile Citizens.

    - name: First Player Marker
      pretext: In games with no Empire, including the very first, this marker shows the player who is first to take a turn in each round.

    - name: Usurper Limiter Marker
      pretext: In games with no Empire, including the very first, this marker is placed on the round track as a reminder that the Oathkeeper title cannot be flipped to Usurper until the fourth round or later.

    - name: 24 Site Cards
      pretext: Sites are locations around the map that you can travel to and rule.

    - name: 195 Denizen Cards
      pretext: Denizens are the peoples, places, and ideas of this land.

    - name: 5 Vision Cards
      pretext: Visions are fresh ways to govern this land. Exiles can win by completing one.

    - name: 47 Relic Cards
      pretext: Relics are lost artifacts you can recover. They grant amazing powers and contribute to winning in some ways.

    - name: 30 Edifice Cards (Double-Sided)
      pretext: Edifices are special denizens that are often placed at the end of the game.

    - name: 36 Legacy Cards
      pretext: Each game, you can earn legacies by fulfilling specific goals. Active legacies give you special powers in later games.

    - name: 11 Setup Cards (Including 6 Foundations)
      pretext: These cards describe setup after the very first game. Its six foundations can change from game to game.

    - name: 5 Chronicle Task Cards
      pretext: These cards describe how to resolve the Chronicle Phase at the end of the game.

    - name: 6 Player Aid Booklets
      pretext: These aids have helpful action and turn summaries.

    - name: Festival Marker (Double-Sided)
      pretext: This marker is used while the Darkest Secret is on its Festival side as a reminder of its power.

    - name: Era Scorepad (Double-Sided)
      pretext: Use this to record lineage points across an era, and draw constellations on the back.

    - name: 12 Dividers
      pretext: These divide card types in the box and parts of the map in the Atlas box, as described in the Welcome to New Foundations booklet.

    - name: Atlas Box
      pretext: This box holds all of the sites and any cards stored with them.

    - name: Reliquary Tile
      pretext: This marks the relics that are held in the Reliquary. The Chancellor, if they're in play, starts with one relic from the Reliquary.

- name: Introduction
  color: '#000000'
  pretext: >
    _Oath_ is a game about history. It's about what gets forgotten, who gets left behind, and how power moves from one part of society to another. In each game, players will steer the fate of the land, affecting all the games to come. Like history, a campaign of _Oath_ has no end.
    <br><br>
    _Decades or even centuries might pass between the games. The time between games is a period of relative stability for the Empire, and the start of a game marks a crisis that threatens to upend it._
    <br><br>
    In your first game, the players take on the role of **Exiles**, leaders and schemers who come from the long-forgotten hinterlands. As Exiles, you can win _Oath_ in one of two ways: by becoming a **Usurper** or completing a **Vision**, which you will learn more about a little later.
    <br><br>
    At the end of your first game, the winner will be crowned **Chancellor** to rule over the **Empire** for the next game. As you keep playing, the Chancellor may offer to let the Exiles become **Citizens** of the Empire.
    <br><br>
    _Even though we call it the Empire in this book, you can call it anything that feels right to fit its politics._
  children:
    - name: Lineages and Legacies
      pretext: >
        During a game of _Oath_, each player will play a character belonging to one of the game's **lineages**. The different lineages are denoted by the color of the pieces.
        <br><br>
        _You can think of the lineage like a family—and it might indeed be a family!—but a character might not be related by blood to the character in the previous game._
        <br><br>
        At the end of each game of _Oath_, players may earn special powers, called **legacies**. You earn legacies by accomplishing specific goals, even if you didn't win the game. Many legacies will change critical rules in _Oath_, changing how the game is set up and played.

    - name: Eras
      pretext: >
        A sequence of games in _Oath_ is called an **era**. Eras allow players to play _Oath_ competitively over multiple games. After each game of _Oath_, the winner will score **lineage points**. These points are added to a running total of all of the points that lineage has scored during the era, tracked on the included era scorepad.
        <br><br>
        _Winning the game will score you at least 3 lineage points, but you can earn more points if you have legacies. With a strong set of legacies, you might score 10 points or more!_
        <br><br>
        When you start a new era, decide as a group when the era will end. You might decide to end the era after playing a number of games, once an amount of real-life time has passed, or once a player passes a threshold of lineage points. If you're unsure, end the era at **20 lineage points**.
        <br><br>
        _The end point should suit your group's play pattern: for instance, if you're playing Oath at a convention, you might decide to end the era after the last scheduled game of the convention._
        <br><br>
        Unlike in other campaign games, you do not need the same players to play in every game—players may join and leave as they wish. However, it's wise to agree at the start of an era how the group will handle these situations.
        <br><br>
        _For example, you might agree that new players should start a totally new lineage rather than take over a previous player's, but you might agree to start them with lineage points equal to the player in last place._

- name: Setup for First Game
  color: '#000000'
  pretext: >
    **Only use this for your very first game! Make sure your box is set up as described in the Welcome to New Foundations booklet. Otherwise, use Setup for Later Games, even the first game of a new era.**
  children:
    - name: Collect Pieces
      pretext: >
        Place the map on the table and collect these pieces nearby:

          - All favor and secrets tokens and attack and defense dice.
          - The Banner of the People's Favor **on its Mob side** _(showing the tattered banner)_. Place a favor `symbol:favor` on it.
          - The Banner of the Darkest Secret **on its Wandering Flame side** _(showing the tattered banner)_. Place a secret `symbol:secret` on it.
          - The Oath of Supremacy goal and the Oathkeeper title.

    - name: Set Up Sites
      pretext: >
        Shuffle the relic cards. Taking from the Recent Sites side of the Atlas box, place one site each in the eight site slots on the map.
        <br><br>
        For each site, do the following.

          - Place favor `symbol:favor` and secrets `symbol:secret` on the site as shown in its top-left corner. _It might not show any._
          - Place relics at it **facedown** equal to its relic slots _(square icons)_.
          - Place bandit warbands on it equal to its capacity _(card icons)_.
          - If it's a Homeland site _(suit in bottom-left)_, place the edifice card stored with it **on its ruined side** at the site.

        _All Homelands in the Atlas box should have matching edifices, as described in the Welcome to New Foundations booklet._

    - name: Set Up Cards
      pretext: >
        Collect 10 denizens of each suit—Arcane `symbol:suit-arcane`, Hearth `symbol:suit-hearth`, Discord `symbol:suit-discord`, Order `symbol:suit-order`, Nomad `symbol:suit-nomad`, and Beast `symbol:suit-beast`—from their suited sections in the box. _Don't take from Edifices or Dispossessed. The Dispossessed starts with two of each suit, as described in the Welcome to New Foundations booklet._
        <br><br>
        Shuffle these denizens to make a stack of 60.
        <br><br>
        Deal 2 denizens from this stack facedown into the three **discard piles** on the map.
        <br><br>
        Deal 3 denizens from this stack facedown to each **player**.
        <br><br>
        Split the remaining stack into one stack of 10 denizens and another stack of 15 denizens.
        <br><br>
        Shuffle 2 random Vision cards into the stack of 10, and the other 3 Visions into the stack of 15.
        <br><br>
        Place the stack with 2 Visions on top of the stack with 3 Visions, then place them both on top of the remaining denizens. Place this stack on the **World Deck** slot on the map.

    - name: Set Up Map
      pretext: >
        Place 3 favor `symbol:favor` `symbol:favor` `symbol:favor` each in the 6 favor banks.
        <br><br>
        Add 1 extra favor `symbol:favor` to each favor bank if you have 5 or more players.
        <br><br>
        For each edifice card on the map, add 1 extra favor `symbol:favor` to the favor bank of the same suit.
        <br><br>
        Find the Round track in the bottom-left corner. Place the Round marker on its first space and the Usurper Limiter marker on its fourth space.
        <br><br>
        Place the Visions Drawn marker on the leftmost space ("0") of the Visions Drawn track.
        <br><br>
        Place the remaining relic cards not at sites onto the Relic Deck space.

    - name: Set Up Players
      pretext: >
        Seat the players at random and give the first player marker to a random player. Each player does the following:

          - Takes a player board on its Exile side.
          - Places 1 favor `symbol:favor` and 1 secret `symbol:secret` on their player board. _Do not take from the favor banks._
          - Collects the 14 warbands of their color and places three of them on their player board.
          - Places the Supply marker of their color on the leftmost space of the Supply track on their player board.
          - Draws 2 random legacy cards.

        Starting with the first player _(with the first player marker)_ and going clockwise, each player does the following in order:
      children:
        - text: Places their pawn on any site.
        - text: Chooses 1 legacy card to keep facedown, returning the other to the legacy deck. _The legacy goals are on the first Chronicle task card._
        - text: Chooses 1 denizen card to keep in their Advisers area by their player board, then discards the other 2 cards facedown.
      posttext: When discarding cards, discard to the Provinces discard pile if your pawn is in the Cradle, to the Hinterland pile if your pawn is in the Provinces, or to the Cradle pile if your pawn is in the Hinterland.

- name: Setup for Later Games
  color: '#000000'
  pretext: >
    **After your very first game, use these rules to set up Oath. This setup is summarized on the setup cards.**
  children:
    - name: Table
      children:
        - text: >
            Place the map on the table and set it up as follows:

              - Place the round marker on the first (starred) space of its track.
              - Place the end die near the Round track if any Imperials are in play.
              - Place the Visions Drawn marker on the leftmost ("0") space of its track.
              - Shuffle the relic deck and place it on the Relic Deck slot on the map.
        - text: Collect all of the attack dice, defense dice, favor tokens, secret tokens, the Oathkeeper title, and the Oathkeeper goal chosen in the previous game.
        - text: Take out the card stack from behind the World Deck divider in the box. Remove the Visions from this stack, shuffle the remaining cards in this stack, then set it aside.

    - name: Players
      pretext: >
        Seat the players in a random order. Each player chooses a player color—if possible, the color they played in the previous game of the era—then they do the following:

          - Take its player board, warbands, and any legacies and starting advisers stored with it.
          - Place 1 favor, 1 secret, and 3 warbands on their board. Place purple warbands if Imperial.
          - Place their Supply marker on the leftmost space of their Supply track.

        **The Chancellor** takes the Chancellor board and the purple pieces instead of their normal color. They take the Grand Scepter and choose a relic from the Reliquary to take facedown. _Notably, the Chancellor usually takes the Oathkeeper title as well, except if certain legacies are in play._
        <br><br>
        **If there's no Chancellor,** a random Citizen becomes the Chancellor first. If there are no Citizens to become Chancellor, do not set up the Chancellor, skip the Empire setup (`rule:4.3`) and use Setup With No Empire instead.

    - name: Empire
      pretext: >
        **If you have a Chancellor, sites ruled by the Empire return to the map, as follows.**
        <br><br>
        Fill site slots going **Hinterward**—top to bottom in the Cradle, then top to bottom in the Provinces, then top to bottom in the Hinterland. **Stop when you reach the Empire divider.**
        <br><br>
        To fill a slot, take the front site from the Recent Sites side of the Atlas box, along with any cards stored on top of it, place it on the map, and populate it:

          - Edifices stored with it start on their intact side _(icon with chain in top-left corner)_. Other denizens start faceup.
          - Relics stored with it start facedown. **Do not fill empty relic slots!**
          - Place 1 Imperial warband on it.

    - name: Setup With No Empire
      pretext: >
        **If you don't have a Chancellor, set up as follows.**
      children:
        - name: Foundations Erode.
          text: Set Foundation I to Wide Horizons and Foundation V to Mob's Favor.

        - name: Sites.
          text: >
            Fill site slots going Hinterward _(see above)_ from the Recent Sites side of the Atlas box. Stop when you reach the Empire divider.
            <br><br>
            Populate each site as follows:
              - Edifices stored with it flip to their **ruined side** _(icon with no chain in the top-left corner)_. Other denizens start faceup.
              - Relics stored with it are placed facedown.
              - **Bandits** are placed equal to its capacity.

        - name: Relics.
          text: >
            Set up relics as follows:
              - Set the Grand Scepter aside.
              - Discard all relics from the Reliquary. _They return in the Chronicle Phase._
              - **Fill all empty relic slots** at sites by drawing relics from the relic deck.

        - name: Exile Out-of-Play Citizens.
          text: All Citizens in the box change into Exiles.

        - name: First Player.
          text: Give the first player marker to a random first player. _They will place their pawn first in setup and play the first turn of each round._

        - name: Round Track.
          text: Place the Usurper Limiter marker on the fourth space of the round track. _As a reminder, you also don't need the end die._

    - name: Foundations
      pretext: >
        **Resolve the six foundation setup cards (4–9) in order, using their current side.**
      children:
        - name: 'Foundation I: Imperial Maps'
          text: >
            <br>Resolve this only if the Chancellor is in play.
            <br><br>
            The Chancellor fills the remaining empty site slots going **Hinterward**, _same order as in `rule:4.3`._
            <br><br>
            They fill **all** these slots from either the Recent or Forgotten Sites side of the Atlas box, but not both.
            <br><br>
            When you place a site, populate it as follows:

              - Edifices stored with it flip to their **ruined side** _(icon with no chain in top-left corner)_. Other denizens start faceup.
              - Relics stored with it start facedown.
              - **Bandits** are placed equal to its capacity.
              - **Fill all of its empty relic slots** by drawing relics from the relic deck.

        - name: 'Altered Foundation I: Wide Horizons'
          text: >
            <br>**Do not fill the remaining empty site slots!**
            <br><br>
            In this game, players can take the **Explore** action, which works as follows. _It is not a Travel action!_
            <br><br>
            You may spend 1 Supply to Explore if your pawn is at the **Hintermost** site. _This is the site furthest in Hinterward order (`rule:4.3`)._
            <br><br>
            Resolve this like the Recover action (`rule:7.7`) with a **difficulty of 4**. _Roll two defense dice. Any number of times, you may spend 1 Supply again to roll two more defense dice and add them to the previously rolled dice._
            <br><br>
            If you succeed, place a site _(from Recent or Forgotten)_ in the next Hinterward slot, populate it as in Foundation I, and place your pawn on that site.

        - name: 'Foundation II: Powerful Tribes'
          text: >
            <br>Place 3 favor `symbol:favor` `symbol:favor` `symbol:favor` on each suit's favor bank. Add 1 extra favor `symbol:favor` with five or more players.
            <br><br>
            Then, for each denizen on the map, add 1 extra favor `symbol:favor` to the matching favor bank.

        - name: 'Altered Foundation II: Movers and Shakers'
          text: >
            <br>Each player takes 5 more favor `symbol:favor` `symbol:favor` `symbol:favor` `symbol:favor` `symbol:favor` from the shared bank. _Players usually start with 6._
            <br><br>
            Then, for each denizen on the map, add 1 extra favor `symbol:favor` to the matching favor bank.

        - name: 'Foundation III: Quiet Ambitions'
          text: <br>Each player draws 2 legacy cards, keeps one facedown in their play area, and returns the other to the box.

        - name: 'Altered Foundation III: Public Ambitions'
          text: >
            <br>Deal 4 legacy cards to a faceup row near the map.
            <br><br>
            Everyone competes to activate these public legacies in the Chronicle Phase. For these, the outgoing Chancellor breaks ties between Imperials alone. Discard public legacies that aren't activated.

        - name: 'Foundation IV: Ties of Fellowship'
          text: >
            <br>Each player who has no starting advisers draws 3 denizens facedown from the starting denizen stack.
            <br><br>
            _You will choose one as a starting adviser later. Players sometimes carry over advisers from the previous game._
            <br><br>
            Then, deal 2 denizens from the starting denizen stack facedown to each discard pile.

        - name: 'Altered Foundation IV: Teeming World'
          text: >
            <br>Each player draws facedown denizens from the starting denizen stack until they have three facedown starting advisers.
            <br><br>
            Discard the rest of the starting denizen stack as evenly as possible, going from Cradle to Provinces to Hinterland. _The world deck will only have Visions!_

        - name: "Foundation V: Mob's Favor"
          text: >
            <br>Set the People's Favor on its **Mob** side. Place 1 favor `symbol:favor` on it from the shared bank.
            <br><br>
            If the Oathkeeper goal is the People's Favor, give the People's Favor to the Chancellor, if there is one. Otherwise, place it in the shared bank.

        - name: 'Altered Foundation V: Grand Council'
          text: >
            <br>Flip the People's Favor to its **Grand Council** side.
            <br><br>
            Otherwise, set it up exactly as in Foundation V.

        - name: 'Foundation VI: Wandering Flame'
          text: >
            <br>Set the Darkest Secret on its **Wandering Flame** side. Place 1 secret `symbol:secret` on it from the shared bank.
            <br><br>
            If the Oathkeeper goal is the Darkest Secret, give the Darkest Secret to the Chancellor, if there is one. Otherwise, place it in the shared bank.

        - name: 'Altered Foundation VI: Festival'
          text: >
            <br>Flip the Darkest Secret to its **Festival side** and place the Festival marker near the area of play.
            <br><br>
            Otherwise, set it up exactly as in Foundation VI.

    - name: Sites and World Deck
      children:
        - name: Place Resources on Sites
          pretext: >
            Place favor and secrets `symbol:favor`/`symbol:secret` on sites as shown in their top-left corner. _Some sites start with nothing._

        - name: Build World Deck
          pretext: >
            From the starting denizen stack, deal a stack of 10 denizens and a stack of 15 denizens.
            <br><br>
            Shuffle the 5 Visions. Shuffle 2 Visions facedown into the stack of 10 denizens, and shuffle 3 Visions facedown into the stack of 15 denizens.
            <br><br>
            Place the stack with 2 Visions on top of the stack with 3 Visions, then place that combined stack on top of the remaining denizens from the starting stack. Place all of this on the World Deck slot.
            <br><br>
            **If there are fewer than 25 denizens in total,** shuffle all of the Visions together with all the denizens to form the world deck. _This often happens with the Teeming World foundation._

    - name: Player Choices
      pretext: >
        **Starting with the Chancellor and going clockwise, each player resolves all of these steps. If there is no Chancellor, start with the player with the first player marker.**
      children:
        - name: Place Pawn
          pretext: >
            If you are an Exile, place your pawn on the Hintermost site ruled by the Empire **or** any site ruled by bandits. _"Hintermost" is the furthest site in Hinterward order (`rule:4.3`)._
            <br><br>
            If you are the Chancellor or a Citizen, place your pawn at a site ruled by the Empire.

        - name: Choose Adviser
          pretext: >
            If you drew denizens in the Ties of Fellowship foundation (IV), choose one of your drawn denizens as a facedown starting adviser and discard the rest.

              - If your pawn is in the Cradle, discard to the Provinces discard pile.
              - If your pawn is in the Provinces, discard to the Hinterland discard pile.
              - If your pawn is in the Hinterland, discard to the Cradle discard pile.

        - name: Reveal Cards
          pretext: >
            You may reveal any number of your relics and advisers, except site-only `symbol:restrictiontree` advisers. _This does not trigger When Played powers._


- name: Key Concepts
  color: '#000000'
  children:
    - name: The Map at Large
      pretext: >
        _Oath_ has a map divided into three **regions**: the central Cradle, the nearby Provinces, and the remote Hinterland. During a game, you will visit, develop, and contest the **sites** in these regions. The Cradle has two sites, and the Provinces and Hinterland each have three.

    - name: Your Pawn, Board, & Resources
      pretext: >
        Each player has a single **pawn** they can move around the map. When the game refers to **your site**, this is the site your pawn is at.
        <br><br>
        Each player also has a **player board**, which shows the various resources held by your pawn.
      children:
        - name: You can spend Supply to take actions.
          text: Your player board has a **Supply** track. Each time you spend Supply, move the Supply marker one space to the right.

        - name: Your player board holds stuff!
          text: Your board can hold any number of **favor** `symbol:favor`, **secrets** `symbol:secret`, and **warbands**. Favor and secrets are resources you can spend on actions. Warbands are a personal army you can use to attack sites and enemies as well as help you defend against them.

    - name: Denizens
      pretext: The people of this world are represented by denizen cards. In play, you can draw them from the world deck or from the discard pile in your pawn's region, as you'll learn about later.
      children:
        - name: Denizens have a suit.
          text: 'There are six suits in the game: Discord `symbol:suit-discord`, Arcane `symbol:suit-arcane`, Order `symbol:suit-order`, Hearth `symbol:suit-hearth`, Beast `symbol:suit-beast`, and Nomad `symbol:suit-nomad`.'

        - name: Denizens also have a power.
          text: These powers can give you new actions or modify other actions you take.

        - name: You can play denizens as your advisers,
          text: placing them beside your player board. You can only have **up to three advisers**—if you would ever gain a fourth, you must discard an adviser first.

        - name: You can also play denizens to your pawn's site.
          text: However, each site can only hold denizens up to its **capacity**, shown by large card icons. You cannot play to a site at full capacity.

    - name: Ruling Sites
      pretext: Each site on the map is always **ruled** either by a player or the **bandits**, a neutral opponent. You **rule** a site if you have any number of your warbands on it.
      children:
        - name: Bandits fill empty sites.
          text: After any action, if a site has no warbands on it, immediately place bandit warbands on it equal to the site's capacity _(large card icons)_. The bandits now rule it.

        - name: A site cannot have multiple rulers.
          text: Only warbands of one color can be on a site.

    - name: Relics & Banners
      pretext: "As you travel around the map, you can gather **relics**, and you can compete over two **banners**: the People's Favor and the Darkest Secret. Both relics and banners give special powers, and they help you meet certain victory goals."
      children:
        - name: You can hold as many as you want.
          text: Unlike advisers, you can hold any number of relics and banners.

        - name: They can be stolen.
          text: Your enemies can raid your pawn to steal your relics and banners, as you will learn about later.

    - name: Using Powers
      pretext: >
        Various cards in _Oath_ give you new powers to use. _Some card types, particularly battle plans, break the rules listed here. Powers are described in full detail in `rule:9.`._
      children:
        - name: To use a power, you must have access to it.
          text: You have access to cards at your site, which is the site with your pawn. You also have access to cards at sites you rule, and everything in your play area near your player board—your relics, banners, advisers, and legacies.

        - name: You must pay its cost, if any.
          text: Its cost is shown on the braid above its text. Usually, you pay this cost by placing the favor or secrets shown onto the card.

        - name: You can only pay costs onto empty cards.
          text: You cannot put favor `symbol:favor` or secrets `symbol:secret` onto a card that has favor or secrets on it already! _Favor and secrets get returned from cards at the end of your turn, letting you use the cards again on your next turn._

    - name: The Oathkeeper
      pretext: >
        The Oathkeeper title is one way that you can win the game.
        <br><br>
        You gain the title when you meet its goal, listed on the Oathkeeper goal tile.
      children:
        - name: There are four Oathkeeper goals, but each game only has one.
          text: >
            In your first game, use the Oathkeeper of Supremacy.

              - **Supremacy:** Rule more sites than each other player. _You must rule at least one. Ignore sites ruled by the bandits—they don't care!_
              - **Protection:** Hold the most relics. _You must have at least one._
              - **The People:** Hold the People's Favor banner.
              - **Devotion:** Hold the Darkest Secret banner.

        - name: The title changes hands immediately.
          text: After any action that changes who meets the goal for the Oathkeeper title, the new player who meets the goal takes the title. If no one meets the goal, return the title to the shared bank.

        - name: The holder keeps the title if tied.
          text: If the title's holder becomes tied for the Oathkeeper goal with another player, the holder keeps the title. If multiple players are tied for the goal **but the holder is not tied**, the holder chooses one of the tied players to take the title.

        - name: Exiles can win by becoming the Usurper.
          text: >
            If an Exile starts their turn as the Oathkeeper, their title flips to Usurper. If they remain the Usurper until their next turn, they win!
            <br><br>
            **In games with no Empire,** such as your very first game, the Oathkeeper can only flip to Usurper in the fourth round and later.

        - name: Flip the Usurper over if it changes hands.
          text: If a player takes the Usurper title from another player, it flips back to Oathkeeper.

        - name: The title also has a defensive battle plan.
          text: The defense dice `symbol:diceb` it gives you will help you defend yourself against enemies. You'll learn more about this in `rule:9.5`.

    - name: The Visions
      pretext: As you draw cards, you might find a **Vision** card!
      children:
        - name: Visions give Exiles another way to win.
          text: As an Exile, you can reveal a Vision you have during your turn, placing it faceup on your player board. For the rest of the game, if you ever meet your Vision's goal at the start of your turn, you win!

        - name: Each game always has four true Visions.
          text: >
            Their goals mirror the four possible Oathkeeper titles, with one extra requirement: at least three Visions must have been drawn from the world deck over the course of the game.
            <br><br>
            _This limit basically gives players a moment to breathe and prepare._

        - name: There is a fifth, false Vision—the Conspiracy.
          text: This does not give you a new way to win, but it gives you a potent one-use power. You will learn more about it in `rule:9.9`.

- name: The Flow of Play
  color: '#000000'
  pretext: >
    In each round, each player takes a turn, starting with the Chancellor and going clockwise. If there is no Chancellor, the round starts with the first player _(with the first player marker)_.
    <br><br>
    On your turn, resolve three phases: Wake, Act, then Rest. Once each player has taken a turn, the round ends. Keep playing like this until someone wins!
  children:
    - name: The Wake Phase
      children:
        - name: Usurper Win?
          text: If you are an Exile and have the Oathkeeper title, flip it to its Usurper side _(unless the Usurper Limiter marker is in play)_. If you already have it on its Usurper side, you win the game.

        - name: Visionary Win?
          text: If you are an Exile and have a revealed Vision card, you win the game if you meet its goal.

        - name: Use Powers.
          text: 'You may use **Wake** powers you have, once each. A Wake power you always have is **Take Wealth**: you may take one favor `symbol:favor` or secret `symbol:secret` from your site if no enemy pawns are there.'

    - name: The Act Phase
      pretext: In this phase, the main part of the game, you can take **actions**. You can take them in any order, even the same one multiple times or none at all!
      children:
        - name: Major actions cost Supply.
          text: >
            You have a set of major actions, as summarized below. Each time you spend Supply, shift your Supply marker on your board once to the right. You can modify your major actions with action modifiers you have access to (`rule:9.4`).

              - `symbol:action-search` **Search:** Draw three cards, discard two, and play one.
              - `symbol:action-travel` **Travel:** Move your pawn to a different site.
              - `symbol:action-campaign` **Campaign:** Attack an enemy's sites or their pawn.
              - `symbol:action-muster` **Muster:** Gain warbands from a card at your site.
              - `symbol:action-trade` **Trade:** Gain favor or secrets from a card at your site.
              - `symbol:action-forge` **Forge:** Draw a relic by spending favor and secrets.
              - `symbol:action-recover` **Recover:** Try to take a relic at your site by rolling dice.
              - `symbol:action-challenge` **Challenge:** Take a banner from an enemy or the bank.

        - name: Minor actions do not cost Supply.
          text: These actions include peeking at relics at your site, negotiating with other players' pawns at your site (`rule:8.5`), and using **Action** powers you have access to (`rule:9.1`).

        - name: Many actions refer to "your site."
          text: This is the site your pawn is at.

    - name: The Rest Phase
      children:
        - name: First, use Rest powers.
          text: You may use any number of your **Rest** powers, once each.

        - name: Second, clean up favor and secrets.
          text: >
            Favor tokens on denizens return to the favor banks on the map, going to the bank that matches the card's suit. Secret tokens on denizens and relics return to your player board. Facedown secret tokens on your board flip faceup.
            <br><br>
            _Secrets can be hard to get, so it's often a good idea to trade for one, and it's often a bad idea to get rid of your last secret early in the game._
            <br><br>
            _Your secrets flip facedown when they are spent outside of your turn._

        - name: Third, refresh your Supply.
          text: >
            Move your Supply marker to the space on its track showing the number of warbands in your warband bank.
            <br><br>
            _Your "warband bank" is the area near your player board, not on the map or on the player board itself. The fewer warbands you've mustered and need to feed, the more Supply you'll have for yourself!_

        - name: You save any unspent Supply.
          text: For each Supply you did not spend on your turn, refresh your Supply one extra space to the left.

    - name: Ending a Round with No Empire
      pretext: >
        _In your very first game and some later ones, you won't have an Empire._
        <br><br>
        A round ends when each player has taken a turn. At the end of the round, advance the round marker one space.
      children:
        - name: After round three, the Oathkeeper can flip to Usurper.
          text: At the end of round three, remove the Usurper Limiter marker from the round track. From now on, the Oathkeeper can flip to Usurper!

        - name: In the rare case that no one wins by the end of the eighth round,
          text: check who wins using the War Exhaustion rules in the next section _(skipping steps 1 and 4)_. If no one wins in this way, the Oathkeeper wins. If there is no Oathkeeper, choose a winner randomly!

    - name: Ending a Round with the Empire
      pretext: >
        _In most games after the first, you will have an Empire led by the Chancellor, possibly with some Citizens._
        <br><br>
        A round ends when each player has taken a turn. At the end of the round, check whether the game ends as follows, then advance the round marker one space.
      children:
        - name: Stable Regime
          pretext: >
            **At the end of rounds five, six, or seven, check for a Stable Regime victory.** If the Chancellor or a Citizen is the Oathkeeper, roll the purple end die. The game ends and the Chancellor wins on the following rolls:

              - **End of round five:** A die roll of 6.
              - **End of round six:** A die roll of 5 or 6.
              - **End of round seven:** A die roll of 3, 4, 5, or 6.

        - name: War Exhaustion
          pretext: >
            **At the end of round eight, the game ends. Check who wins from a War Exhaustion victory.** Resolve these steps in order.
          children:
            - name: Stable Regime.
              text: If the Chancellor or a Citizen is the Oathkeeper, the Chancellor wins.

            - name: Usurper.
              text: If an Exile is the Usurper, they win.

            - name: Visionary.
              text: If an Exile has a revealed Vision and meets its goal, they win. If multiple Exiles meet Vision goals, break the tie in favor of the Vision of Conquest _(most sites)_, then Rebellion _(People's Favor)_, then Sanctuary _(most relics)_, then Faith _(Darkest Secret)_.

            - name: Chancellor.
              text: If no one wins in the steps above, the Chancellor wins.

        - name: Successor to the Chancellor
          pretext: >
            **A Citizen can steal the Chancellor's win.** If the Chancellor would win but a Citizen meets the Successor goal, shown under the Oathkeeper goal, that Citizen wins instead:

              - **Supremacy (Sites):** Holds more relics than the Chancellor and each other Citizen. _Check against players individually._
              - **The People (People's Favor):** Holds the Darkest Secret banner.
              - **Protection (Relics):** Holds the People's Favor banner.
              - **Devotion (Darkest Secret):** Holds the Grand Scepter relic.


- name: Major Actions
  color: '#000000'
  children:
    - name: Search `symbol:action-search`
      pretext: >
        **Cost: 2–4 Supply**
      children:
        - name: Choose draw source.
          text: You can draw cards either from the world deck or from the discard pile of the region that your pawn is in.

        - name: Spend Supply.
          text: If drawing from the world deck, spend the amount of Supply shown by the Visions Drawn track near the world deck. If drawing from a discard pile, spend 2 Supply.

        - name: Draw three cards.
          text: Draw them one at a time. **If you draw a Vision card from the world deck**, stop drawing cards and advance the Visions Drawn marker one space.

        - name: Discard cards.
          text: Discard all the cards you drew except for one. If your pawn is in the Cradle, discard the cards to the top of the Provinces discard pile. If it's in the Provinces, discard to the Hinterland pile. If it's in the Hinterland, discard to the Cradle pile.

        - name: Play one card.
          text: Play the remaining card to your site or your advisers, as described below, or you can discard it. If the card shows a tree `symbol:restrictiontree`, you can only play it to your site. If it shows a person `symbol:restrictionperson`, you can only play it to your advisers.
          children:
            - name: Playing to Your Site
              children:
                - name: Playing to a site earns you favor.
                  text: Take one favor `symbol:favor` from the favor bank of the played card's suit. _If you're low on favor, you can play to your site to get one. It's often helpful!_

                - name: You cannot play to a full site...
                  text: 'You cannot play to a site that has denizens equal to its capacity. _Homeland sites are a notable exception: if you play a card to a Homeland site of its suit, you may discard a card from the site first (`rule:10.5.8`)._'

            - name: Playing to Your Advisers
              children:
                - name: You can play to your advisers faceup or down.
                  text: >
                    Unlike playing to a site, you may play cards to your advisers facedown.
                    <br><br>
                    _Think of facedown advisers like a hand of cards—you can even hold site-only cards `symbol:restrictiontree` facedown. While facedown, they don't have a suit, power, or play restrictions. Later, as a minor action (`rule:8.1`), you can flip facedown advisers up and play them like you just drew them!_

                - name: You can have up to three advisers.
                  text: >
                    Both faceup and facedown advisers count toward your adviser limit. If you would ever gain an adviser that exceeds this limit, you must first discard an adviser.
                    <br><br>
                    _If a card is locked `symbol:locked`, it cannot be discarded (`rule:9.2.3`)._

            - name: Playing Visions
              children:
                - name: Exiles can reveal Visions.
                  text: When you play a Vision faceup, place it on the Vision space in the center of your player board. If a Vision is there already, discard that Vision first.

                - name: The Chancellor and Citizens cannot reveal Visions.
                  text: The one exception is the Conspiracy (`rule:9.9`)!

    - name: Travel `symbol:action-travel`
      pretext: >
        **Cost: 1–4 Supply**
      children:
        - name: Choose destination site.
          text: Choose the site where you want to move your pawn to.

        - name: Spend Supply.
          text: >
            The Supply cost depends on the regions that your pawn is traveling from and traveling to:

              - If your pawn is in the **Cradle**, spend 1 to travel to the other Cradle site, 2 to travel to any Provinces site, or 4 to travel to any Hinterland site.
              - If your pawn is in the **Provinces**, spend 2 to travel to any other site.
              - If your pawn is in the **Hinterland**, spend 3 to travel to either other Hinterland site, 2 to travel to any Provinces site, or 4 to travel to any Cradle site.

        - name: Move your pawn.
          text: Move your pawn to the site you chose.

        - name: Travel Powers on Sites
          pretext: Many sites have a power that changes how you can travel between them, as listed below. There are more site powers than this—the full list of site powers is in `rule:10.5`.
          children:
            - name: Coast
              text: Traveling from here to a Coast or Island costs only 1 Supply and ignores other Travel modifiers _(Mountain, Pass, etc.)_.

            - name: Island
              text: This site has the Coast power. Traveling to it costs 2 Supply more than its normal Travel cost unless you're traveling from a Coast or Island. _Also, the Sunken Isles has no capacity, so it cannot usually be targeted in a Campaign (`rule:9.10.5`)._

            - name: Mountain
              text: Traveling to this site costs one more Supply than its normal Travel cost. _Do not add this Supply cost if this site also has the Coast power and you're traveling to it from a Coast._

            - name: Pass
              text: You **cannot** travel to other sites in this region if your pawn is outside this region, unless you have the consent of the Pass's ruler. _Ignore this power if you rule the Pass. The bandits never consent. The Pass also limits targeting sites in campaigns (`rule:10.5.6`)._

    - name: Campaign `symbol:action-campaign`
      pretext: >
        **Cost: 2 Supply**
      children:
        - name: Choose campaign type and targets.
          text: >
            You may either **conquest** against your site _(at your pawn)_ if an enemy rules it, or you may **raid** an enemy pawn at your site.

              - **Conquest:** The ruler of your site is the **defender**. _(This can be the bandits.)_ You must **target** your site. You may also target any number of other sites ruled by the defender.
              - **Raid:** The pawn's player is the **defender**. You must **target** their pawn. You may target any number of faceup relics and banners _(even zero)_ in their play area.

        - name: Gather dice pools.
          text: >
            The attacker gathers attack dice `symbol:dicer` up to the number of warbands on their player board, called their **force**, into their **attack pool**. The defender gathers the number of defense dice `symbol:diceb` shown on the attacker's targets into their **defense pool**.
            <br><br>
            _Raiding always adds two defense dice for the pawn, as shown on the defender's player board._

        - name: Use battle plans.
          text: >
            The attacker may use battle plans they rule, once each, in any order (`rule:9.5`). Then the defender may use their own in the same way. _Remember the Oathkeeper title!_

              - **Play Facedown Plans.** If a player has a facedown battle plan, they may play it faceup to their play area in order to use it. _They cannot play site-only plans or play plans without using them._
              - **Bandits.** The bandits use battle plans they rule that cost no favor or secrets.
              - **Empty Attack Pool.** If a battle plan would remove an attack die from the attack pool but it has none, add a defense die to the defense pool instead.

        - name: Attack.
          text: >
            The attacker rolls their attack pool and counts their **attack** value:

              - **Swords.** Each sword `symbol:sword` adds one to the attack value. Every two hollow swords `symbol:swordh` `symbol:swordh` add one to the attack value.
              - **Skulls.** For each skull `symbol:skull`, the attacker kills a warband on their player board. If they cannot, the swords `symbol:sword` `symbol:sword` on the skull's die do not add to the attack value.

        - name: Sacrifice warbands.
          text: 'The attacker may sacrifice warbands on their player board: for each warband they choose to kill, they add one to the attack value.'

        - name: Defend.
          text: >
            The defender rolls their defense pool and counts their **defense** value:

              - **Shields.** Each shield `symbol:shield` adds one to the defense value. Each doubler `symbol:x2` doubles the total shields `symbol:shield` rolled. _Multiple doublers `symbol:x2` stack exponentially—x4, x8, etc._
              - **Warbands on Targets.** Each warband in the defender's **force** adds one to the defense value. In conquests, these are the defender's warbands at targeted sites. In raids, these are the defender's warbands on their player board.

        - name: Declare victor.
          text: If the attack value is higher than the defense value, the attacker is **victorious** and the defender is **defeated**. If not, the defender is victorious and the attacker is defeated.

        - name: Kill defeated warbands.
          text: >
            Kill **half** of the warbands in the defeated player's force, rounding down. Move the remaining warbands in their force to their player board.
            <br><br>
            If you defeated the bandits, kill **all** bandit warbands at the targeted sites.

        - name: Resolve conquest victory.
          text: >
            If a conquest was victorious, the attacker may place any number of their warbands _(even zero)_ from their force onto the targeted sites. _Then, fill sites that have no warbands with bandit warbands equal to their capacity._

        - name: Resolve raid victory.
          text: 'If a raid was victorious, do the following in order:'
          children:
            - text: >
                The attacker takes targeted relics and banners. If a banner is taken, adjust its resources following its right ribbon, as follows for their starting Mob and Wandering Flame sides:
                <br><br>
                **People's Favor.** Return all favor `symbol:favor` from the banner to the favor banks on the map. Return the favor one at a time to the favor bank with the fewest favor. On a tie, return it to the leftmost favor bank with the fewest favor.
                <br><br>
                **Darkest Secret.** Burn all secrets `symbol:secretb` from the banner. _They return to the shared bank._

            - text: Discard the defender's facedown advisers and facedown relics, including all battle plans that started facedown but were played faceup in step 3. _These relics are removed from the game until the Chronicle Phase. If the Conspiracy is discarded, the holder returns it to the box._

            - text: The defender burns half of their favor `symbol:favorb`, rounding down. _It returns to the shared bank._

            - text: The attacker places the defender's pawn at any other site. _This is not a Travel action._

        - name: Use remaining battle plans.
          text: Resolve any battle plans that are resolved "At End" or say "If you're victorious," or "If you're defeated."
      posttext: >
        **Dice Faces**

          - **Attack:** hollow sword `symbol:swordh` (x3), sword `symbol:sword` (x2), skull and two swords `symbol:skull` `symbol:sword` `symbol:sword` (x1)
          - **Defense:** blank (x2), shield `symbol:shield` (x2), two shields `symbol:shield` `symbol:shield` (x1), doubler `symbol:x2` (x1)

    - name: Muster `symbol:action-muster`
      pretext: >
        **Cost: 1 Supply**
      children:
        - name: Place favor.
          text: Place a favor `symbol:favor` on an empty denizen at your site. _"Empty" means it doesn't have favor or secrets on it._

        - name: Gain warbands.
          text: Gain one warband on your board, and gain **another** warband for each faceup adviser you have matching the card you placed the favor on. _"Matching" means it has the same suit._

    - name: Trade `symbol:action-trade`
      pretext: >
        **Cost: 1 Supply**
        <br><br>
        You can either trade for favor or for secrets, as follows:

          - **To trade for favor,** place a secret `symbol:secret` on an empty denizen at your site. Gain one favor `symbol:favor`, and gain **another** favor `symbol:favor` for each faceup adviser you have matching the card you placed the secret on. This favor comes from the favor bank matching the card you placed the secret on.
          - **To trade for secrets,** place a favor `symbol:favor` on an empty denizen at your site and burn one favor `symbol:favorb`. _("Burn" returns it to the shared bank beside the map, not to a favor bank on the map!)_ Take one secret `symbol:secret` from the shared bank for each faceup adviser you have matching the card you placed the favor on.

    - name: Forge `symbol:action-forge`
      pretext: >
        **Cost: 1 Supply**
        <br><br>
        To take this action, you must rule your site, the site must have a Forge icon in its bottom-right corner, and it must have 3 empty denizens.
      children:
        - name: Place resources.
          text: Place the favor `symbol:favor` and secrets `symbol:secret` shown in the site's bottom-right corner on these 3 empty denizens at your site, one on each in any order.

        - name: Draw a relic.
          text: >
            Draw a relic from the relic deck and place it **facedown** by your player board.
            <br><br>
            _Facedown relics can be revealed with a minor action (`rule:8.3`)._

    - name: Recover `symbol:action-recover`
      pretext: >
        **Cost: 1 Supply**
      children:
        - name: Roll dice.
          text: Roll two defense dice `symbol:diceb` `symbol:diceb` and count the shields `symbol:shield` rolled. Each doubler `symbol:x2` you roll doubles the total shields `symbol:shield` rolled. _Multiples stack exponentially—x4, x8, etc._

        - name: Roll more dice?
          text: Any number of times, you may spend another 1 Supply to roll two **more** defense dice `symbol:diceb` `symbol:diceb`, adding them to all of the defense dice you have rolled in this action.

        - name: Take relic?
          text: If you rolled shields `symbol:shield` **equal to or greater** than your site's Recover difficulty, in its bottom-right corner, you peek at the relics at your site, take one of them, and place it **facedown** by your player board. _Facedown relics can be revealed with a minor action (`rule:8.3`)._
      posttext: >
        **Dice Faces**

          - **Defense:** blank (x2), shield `symbol:shield` (x2), two shields `symbol:shield` `symbol:shield` (x1), doubler `symbol:x2` (x1)

    - name: Challenge `symbol:action-challenge`
      pretext: >
        **Cost: 1 Supply**
      children:
        - name: Choose a banner.
          text: >
            Choose the People's Favor or the Darkest Secret. If an enemy holds it, your pawn must be at the same site as their pawn. You cannot choose a banner you hold.

              - To challenge the People's Favor, you must have **more** favor `symbol:favor` than the favor on it.
              - To challenge the Darkest Secret, you must have **more** secrets `symbol:secret` than the secrets on it. _Facedown secrets do not count toward this._

        - name: Take the banner.
          text: >
            Remove favor or secrets from the banner you took as shown on the banner. The rules for the starting banner sides, Mob and Wandering Flame, are below.

              - **People's Favor (Mob).** Return all favor `symbol:favor` from the banner to the favor banks on the map. Return the favor one at a time to the favor bank with the fewest favor. On a tie, return it to the leftmost favor bank with the fewest favor.
              - **Darkest Secret (Wandering Flame).** Place half of the secrets `symbol:secret`, rounded down, from the banner onto **sites** with the fewest total favor and secrets. You decide ties. Give the rest of its secrets to the banner's previous holder. If the banner was not held by an enemy, place all of its secrets onto sites instead, as described above.

        - name: Place resources.
          text: >
            Place favor or secrets on the banner as follows:

              - If you took the People's Favor, place **more** favor `symbol:favor` on it than it had previously.
              - If you took the Darkest Secret, place **more** secrets `symbol:secret` on it than it had previously.
      posttext: >
        _For a full description of the banners, see Banners in Detail (`rule:11`)._


- name: Minor Actions
  color: '#000000'
  pretext: You can take minor actions during your Act Phase. Minor actions cost 0 Supply by default.
  children:
    - name: Play/Discard Facedown Adviser
      pretext: >
        Play one of your facedown advisers faceup, or discard it, as if you searched (`rule:7.1`).
        <br><br>
        _Play restrictions and Search modifiers still apply (`rule:9.2`). If you discard, remember to discard to the next region: Provinces if you're in the Cradle, and so on. You can peek at your facedown advisers._

    - name: Use Action Power
      pretext: Use an **Action** power that you have access to (`rule:9.1`).

    - name: Reveal/Peek at Relics
      pretext: >
        Peek at relics at your site. You may now peek at these relics at any time if they're still at the site.
        <br><br>
        You may also flip a facedown relic in your play area faceup. _You can peek at your facedown relics._

    - name: Move Warbands To/From Your Site
      pretext: >
        Move any number of your warbands **except the last one** from your site to your board.
        <br><br>
        If you rule your site, you may move any number of warbands from your board to your site.

    - name: Negotiate
      pretext: >
        Negotiate with any number of players whose pawns are at your site. The negotiators may give each other **favor** and **relics** _(but not banners or secrets)._ They may also show each other hidden information they can peek at _(like facedown advisers, their relics, and relics they've peeked at)_.
        <br><br>
        _Players are otherwise free to discuss the game and may make non-binding promises about future actions at any time! However, we do strongly recommend agreeing on some communication limits (`rule:15.8`)._

- name: Cards in Detail
  color: '#000000'
  pretext: >
    **[Click here](https://cards.buriedgiantstudios.com/search?q=game:oath) for a detailed card database!**
  children:
    - name: Powers
      children:
        - name: To use a power, you must have access to it.
          text: >
            You have access to faceup powers that are at your site and faceup powers that you rule: those at sites you rule and those in your play area.
            <br><br>
            _Battle plans (`rule:9.5`) require rule._

        - name: You must pay its cost, if any.
          text: >
            Its cost is shown on the braid above its text.

              - `symbol:favor` Place one favor on the card.
              - `symbol:favorb` Burn one favor, returning it to the shared bank.
              - `symbol:secret` Place a faceup secret on the card.
              - `symbol:secretb` Burn a faceup secret, returning it to the shared bank.

        - name: If it has a cost, the card must be empty.
          text: You cannot put favor or secrets on a card with favor or secrets on it. 
                <br><br>
                _Battle plans (`rule:9.5`) are less restricted._

        - name: If you pay a cost outside of your turn,
          text: such as using a battle plan while defending, move paid favor to the matching favor bank immediately, and flip paid secrets facedown, keeping them on your board. You cannot remove facedown secrets from your board _(such as to pay costs)_ but enemies can _(such as by stealing or burning them with powers)_.

        - name: Do as much as possible.
          text: When you use a power, resolve as much of it as possible except for parts that say "may."

    - name: Restriction Icons
      pretext: Some cards have restrictions, shown below the card's suit, which apply while the card is faceup.
      children:
        - name: Site Only.
          text: Cards with a site `symbol:restrictiontree` restriction can only be played, moved, or swapped to a site.

        - name: Advisers Only.
          text: Cards with an adviser `symbol:restrictionperson` restriction can only be played, moved, or swapped to a player's advisers.

        - name: Locked.
          text: >
            Cards with a chain restriction, once played, cannot be discarded, moved, flipped, or swapped. _"Burying" cards explicitly ignores the locked restriction._

    - name: Standard Powers
      pretext: "Standard powers have no action icons on the card's braid:"
      children:
        - name: Wake.
          text: You may use powers that start with "**Wake:**" during your Wake Phase, once each.

        - name: Action.
          text: You may use powers starting with "**Action:**" during your Act Phase.

        - name: When Played.
          text: You must use powers starting with "**When Played,**" after playing them faceup. _Gain favor from playing to a site and resolve modifiers before resolving this._

        - name: Rest.
          text: You may use powers starting with "**Rest:**" at the start of your Rest Phase, once each.

        - name: Setup / When Explored.
          text: 'Powers that start with "**Setup / When Explored:**" are resolved during setup at the time it states. If it is not stated, it is resolved at the end of setup. The **When Explored** text is used with the Wide Horizons foundation (`rule:4.5.2`): it triggers when the card is placed on the map by the Explore action.'

        - name: When Negotiating.
          text: You may use powers starting with "**When Negotiating:**" during a Negotiate action, whether you took it or are negotiating with another player who did.

    - name: Major Action Modifiers
      pretext: Modifiers have an icon matching a major action on its braid. At the **start** of a major action, you may use any number of modifiers with its matching action icon in any order, once each.
      children:
        - name: Modifiers do not affect later actions.
          text: When you use a modifier, it only modifies your current action, not later ones. _However, you can use a given modifier that has no cost multiple times per turn to modify different actions._

        - name: Some modifiers are mandatory.
          text: A modifier is not optional if it says "must" or "cannot."

        - name: Active modifiers cannot be discarded.
          text: A modifier cannot be discarded during the major action it is modifying.

    - name: Battle Plans
      pretext: A battle plan is a type of Campaign modifier whose icon is surrounded by a crown.
      children:
        - name: You must rule a battle plan to access it.
          text: This is more limited than the normal rule for access. _You rule denizens at sites you rule and everything in your play area._

        - name: Battle plans are used during Campaigns.
          text: You choose to use battle plans in the Use Battle Plans step of Campaign, not the start of the action. Red, blue, and gradient power boxes show that the battle plan is used by the attacker, defender, or either, respectively.

        - name: Battle plans can be used even if full!
          text: Each battle plan can be used once per Campaign, even if it has favor or secrets on it.

        - name: Many battle plans change the dice pool.
          text: They can add (+) or remove (–) attack dice `symbol:dicer` or defense dice `symbol:diceb`. Battle plans that use "+/–" can add or remove the die shown.

        - name: The Oathkeeper title has a battle plan.
          text: It adds one defense die `symbol:diceb` on its Oathkeeper side, and two defense dice `symbol:diceb` `symbol:diceb` on its Usurper side _(which only Exiles can flip to)_.

    - name: Persistent Powers
      pretext: A power with a black, thick braid affects **all of the players** that it describes, ignoring access rules. It takes effect during the action that it modifies or else during the time it says. _The Festival (`rule:11.2.4`) is a persistent power that is not on a card._
      children:
        - name: You choose how to enforce them.
          text: You may give consent to enemies to let them ignore persistent powers you rule that harm or limit them, except in Campaign actions. _If you forget to enforce one, it has no effect! Bandits always enforce them._

    - name: Edifices
      pretext: >
        Edifices are a special type of denizen with two sides: **intact** and **ruined**. The intact side is locked `symbol:locked` and the ruined side is not.
        <br><br>
        Edifices **cannot** be added to a player's advisers _(such as with a swap power)_.
        <br><br>
        If an edifice is removed from the map in any way, place it intact on the bottom of the edifice deck _(counting on the intact side)_. The edifice deck is kept behind the Edifices divider in the box, with the same facing for all cards.

    - name: Grand Scepter
      pretext: The Grand Scepter is a special relic that cannot be discarded or buried in any way. Its holder can offer Citizenship and exile Citizens (`rule:13`).

    - name: The Conspiracy
      pretext: >
        The Conspiracy is a special Vision card that does not give a new victory goal, but instead gives a special action.
        <br><br>
        When you play it faceup, take one relic or banner from a player whose pawn is at your site, then return the Conspiracy to the box.
      children:
        - name: The Chancellor and Citizens can play the Conspiracy.
          text: This is different from the four true Visions, which the Chancellor and Citizens cannot play faceup.

    - name: Key Clarifications
      children:
        - name: Spend No Supply.
          text: Powers that let you take or modify an action and say "spend no Supply" ignore the entire Supply cost of the action, including any increases to it from other powers _(such as the Island and Mountain site powers)_.

        - name: Adviser Limits.
          text: Some powers _(Assassin, Pied Piper, etc.)_ change your adviser limit. When you want to play a card that changes your adviser limit, check whether to discard advisers based on your new adviser limit. If you have multiple cards that change your adviser limit, your adviser limit is the lowest among them—they don't add together. However, cards that remove an adviser limit cannot be superseded.

        - name: Binding Promises.
          text: Some powers let players negotiate binding promises. The Tribunal allows binding promises of future actions, including consequences if the promise is broken; if it is unclear whether such a promise is broken, resolve it by coin flip.

        - name: Becoming a Citizen.
          text: Some powers let you become a Citizen. If no Chancellor is in the game, they let you become a Chancellor and take the Grand Scepter. However, if you are playing for the first time, ignore these powers!

        - name: The Sunken Isles.
          text: The Sunken Isles site has no capacity, so it starts with no bandits. It cannot be targeted in a Campaign except in the very rare case that warbands are on it.

- name: Sites in Detail
  color: '#000000'
  pretext: Sites have the following elements.
  children:
    - name: 'Starting Resources'
      pretext: Favor or secrets placed on the site in setup. _(With the Wide Horizons foundation, it is placed when the site is Explored.)_ During your Wake Phase, you may use Take Wealth to take one favor `symbol:favor` or secret `symbol:secret` from your site if no enemy pawns are there (`rule:6.1.3`).

    - name: 'Defense Dice'
      pretext: The number of defense dice it adds when targeted in a Campaign.

    - name: 'Capacity'
      pretext: The number of denizens that the site can hold—it cannot hold more denizens in any way. After any action, if a site has no warbands on it, immediately place bandit warbands on it equal to its capacity.

    - name: 'Relic Slots'
      pretext: The number of relics the site can hold.

    - name: 'Site Power'
      pretext: See the list of powers below.
      children:
        - name: Plains.
          text: This site has no power.

        - name: Coast.
          text: Traveling from here to a Coast or Island costs only 1 Supply and ignores other Travel modifiers _(Mountain, Pass, etc.)_.

        - name: Island.
          text: This site has the Coast power. Traveling to it costs 2 Supply more than its normal Travel cost unless you're traveling from a Coast or Island. _Also, the Sunken Isles site has no capacity, so it cannot usually be targeted in a Campaign (see full rules at `rule:9.10.5`)._

        - name: River.
          text: '**Wake:** You may place your pawn at another River. _This is not a Travel action._'

        - name: Mountain.
          text: Traveling to this site costs one more Supply than its normal Travel cost. _Do not add this Supply cost if this site also has the Coast power and you're traveling to it from a Coast._

        - name: Pass.
          text: If your pawn is outside this region, you **cannot** travel to other sites in this region or target other sites in this region in campaigns, unless you have the consent of the Pass's ruler. _You can ignore this power if you rule the Pass. The bandits never consent._

        - name: Enduring.
          text: Cards at this site are not discarded in the Chronicle Phase during the Shape Empire step.

        - name: Homeland.
          text: There is a Homeland of each suit. When playing a card of its Homeland suit to this site, you may discard a card from the site first _(even one of matching suit)_.

        - name: Dual Powers.
          text: Some sites have two powers instead of one. _For example, the Tidal Marshes is both a River and a Coast._

- name: Banners in Detail
  color: '#000000'
  children:
    - name: Taking Banners
      pretext: >
        When a banner is taken, adjust the favor `symbol:favor` or secrets `symbol:secret` on it. **Round down** when adjusting by half.
        <br><br>
        In a Challenge, resolve the left ribbon from top to bottom.
        <br><br>
        In a Campaign, resolve the right ribbon from top to bottom.

          - `symbol:banner-returnfavor` Return favor `symbol:favor` to the banner's previous holder. If the banner was in the shared bank, return favor `symbol:favor` to the favor banks as described below.
          - `symbol:banner-bankfavor` Return favor `symbol:favor`, one at a time, to the favor banks. Return the favor to the bank with the least favor. On a tie, return it to the leftmost tied bank.
          - `symbol:secretb` Burn secrets `symbol:secretb`.
          - `symbol:banner-scattersecrets` Place secrets `symbol:secret`, one by one, onto sites on the map. Place the secret on the site with the fewest total favor and secrets. On a tie, you choose which tied site to place it on.
          - `symbol:banner-returnsecrets` Return secrets `symbol:secret` to the banner's previous holder. If the banner was in the shared bank, burn the secrets `symbol:secretb`.
          - `symbol:banner-removefestival` Remove the festival marker from the map.

    - name: Banner Powers
      pretext: Both banners have an action that lets you place favor or secrets, as relevant, from your player board onto it. _This makes it harder to challenge!_ Their other powers are listed below.
      children:
        - name: Mob (People's Favor)
          pretext: >
            When playing a card to a site, you may first discard a denizen from the site.
            <br><br>
            _Ruined edifices that are discarded return to the edifice deck._

        - name: Grand Council (People's Favor)
          pretext: When playing a card, you may play it to **any Imperial site** on the map. When playing a card to an Imperial site, you may first discard a denizen _(even a ruined edifice)_ from the site.

        - name: Wandering Flame (Darkest Secret)
          pretext: >
            As an action, you may place your pawn at any site with a secret on it. _Not a Travel action._
            <br><br>
            As an action, you may place a secret onto your site.

        - name: Festival (Darkest Secret)
          pretext: >
            In your Rest Phase, you must place the festival marker over the cards at your site.
            <br><br>
            The festival has the following persistent power:
            <br><br>
            Your enemies cannot place favor or secrets on denizens at the site with the festival marker, and cannot use their powers unless they're persistent powers. _They can still peek at and recover relics. You may give enemies consent to ignore the festival, and they ignore it if you forget to enforce it!_

- name: Legacies in Detail
  color: '#000000'
  pretext: >
    In setup, each player normally draws 2 legacy cards and keeps one, discarding the other.
    <br><br>
    The legacy you keep is **dormant** (facedown). It will be lost in the Chronicle Phase at the end of the game unless you activate it, flipping it faceup, by meeting its **goal**:

      - `symbol:legacy-scepter` Hold the Grand Scepter. _If none, win._
      - `symbol:legacy-sites` Rule the most sites.
      - `symbol:legacy-secret` Hold the Darkest Secret.
      - `symbol:legacy-favor` Hold the People's Favor.
      - `symbol:legacy-suit` Rule the most cards of this suit _(even advisers)_.
      - `symbol:legacy-relic` Hold the relic of the highest value.
  children:
    - name: Bandits don't compete for legacy goals.
      pretext: Only compare the sites and cards ruled by players.

    - name: Players can have three active legacies.
      pretext: If you ever have more, you must discard active legacies until you have three. You may hold any number of dormant legacies.

    - name: Exiles must maintain their legacies.
      pretext: In the Chronicle Phase, Exiles must meet the goals of their active legacies or else they become dormant. These legacies can be flipped back to active if they become Imperial in that Chronicle Phase.

    - name: For legacy goals, Imperial sites are ruled by all Imperial players.
      pretext: Likewise, all Imperials rule the cards at Imperial sites for the purpose of legacy goals.

    - name: Some legacies alter foundations.
      pretext: When one is activated, flip the foundation in your setup cards to its altered side immediately. If this legacy is discarded, do not flip the foundation back! Altered foundations can only return to normal during the Beacon (`rule:14.4.3`).

    - name: Legacies aren't suited.
      pretext: The suit is only used for counting bonus points. For example, a legacy showing `symbol:suit-order` is not an Order card.


- name: The Empire
  color: '#000000'
  pretext: >
    The Chancellor and Citizens are **Imperial players** _("Imperials" for short)_. Sites with Imperial warbands are called **Imperial sites**.
    <br><br>
    **With the Chancellor and Citizens in the game, players can win in two more ways:** Stable Regime and Successor victories (`rule:6.5`).
  children:
    - name: Becoming a Citizen
      pretext: >
        Exiles can become Citizens in various ways. Most often, the player holding the Grand Scepter relic may offer Citizenship to an Exile, including themself, during a Negotiate action (`rule:8.5`).
        <br><br>
        If a player becomes a Citizen, do the following:

          - Flip their board to its Citizen side.
          - Replace all warbands on their board and on the map with purple Imperial warbands. If there are not enough, the Exile chooses which warbands of theirs to replace, and the rest are removed.
          - Discard their revealed Vision, if they have one.
          - If they hold the Oathkeeper title and it is on its Usurper side, flip it to its Oathkeeper side. _In games with the Oath of Supremacy, the title also transfers to the Chancellor._
          - End their Act Phase if it is their turn.
          - Refresh their Supply to its leftmost space.
      children:
        - name: Citizenship in Games with No Empire.
          pretext: >
            In games with no Empire, powers that let a player become a Citizen instead let them become the Chancellor if there isn't one yet. This works like becoming a Citizen, except the player swaps their player board for the Chancellor board and takes the Grand Scepter.
            <br><br>
            However, if you are playing your very first game, we recommend ignoring these powers.

    - name: Exiling from the Empire
      pretext: >
        Throughout the game, Citizens may become Exiles in various ways. When a Citizen is exiled, do the following:

          - Flip their board to its Exile side.
          - Replace all purple Imperial warbands on their board with warbands of their color. Remove any purple warbands in excess of the amount they can replace. _Don't remove or replace Imperial warbands on the map._
          - End their Act Phase if it is their turn.
          - Refresh their Supply to its leftmost space.
      children:
        - name: Citizens can exile themself.
          text: As a minor action, Citizens may exile themself by giving 1 favor per Imperial warband on their board to the Chancellor, but no less than 3 favor. _For example, if a Citizen has only 1 Imperial warband, they give 3 favor to the Chancellor._

        - name: The Grand Scepter's holder can exile Citizens.
          text: The Grand Scepter is the most common way to exile other players. It has a battle plan that says, "If you're an Imperial and victorious against a Citizen, you may exile them," which costs `symbol:favorb` `symbol:favorb` `symbol:favorb`.

    - name: Imperial Laws
      children:
        - name: Seal of the Empire.
          text: During an Imperial player's turn, they rule Imperial sites.

        - name: Steward of Imperial Domains.
          text: On Exiles' turns, the Chancellor rules all Imperial sites. The Chancellor is the defender if a player conquests against Imperial sites in a campaign. Finally, if the Oathkeeper title is Supremacy, the Chancellor holds the Oathkeeper title if there are more Imperial sites than sites ruled by each Exile. _Citizens never hold the Oathkeeper of Supremacy title._

        - name: Imperial Warbands.
          text: All Imperial players use purple Imperial warbands instead of warbands of their own color.

        - name: Refreshing Supply.
          text: When refreshing their Supply in the Rest Phase, Citizens refresh their Supply to match the Chancellor's Supply.

        - name: Chancellor's Eye.
          text: A Citizen can only move Imperial warbands from their site to their player board with the Chancellor's consent.

        - name: Warband Transfers.
          text: As a minor action, an Imperial player may move warbands to and from their board and another Imperial player's board if that player's pawn is at their site and consents.

        - name: Imperial Tactics.
          text: In a campaign, an Imperial player may use battle plans in the play areas of **any** Imperial players with their consent, and they may use battle plans at Imperial sites with the Chancellor's consent. Costs and requirements for battle plans _(such as holding the Darkest Secret)_ may be paid for or met by **any** Imperial player _(even splitting costs and requirements between players)_. _Remember, the Oathkeeper title is a defensive battle plan._

        - name: Imperial Infighting.
          text: In a campaign, an Imperial player may raid another Imperial player. Likewise, a Citizen may conquest against Imperial sites—in this case, the Chancellor is the defender. _Usually, Citizens do this to weaken the Empire, since they can choose not to place warbands on targeted sites, letting the bandits rule them._ Imperial Tactics still applies, but the same battle plan cannot be used by both the attacker and defender.

- name: Chronicle Phase
  color: '#000000'
  pretext: After the game, resolve the Chronicle task cards in order.
  children:
    - name: 'Task 1: The Sun'
      children:
        - name: First, Resolve Legacies.
          pretext: >
            Reveal all facedown relics held by players.
            <br><br>
            Players flip their dormant legacies whose goals they meet to active, and they discard their dormant legacies whose goals they don't meet, returning them to the legacy deck.
            <br><br>
            If active legacies alter foundations, flip those setup cards to their altered sides.
            <br><br>
            Then, **Exiles** _(not Imperials)_ flip their active legacies whose goals they do not meet to dormant. These are called **newly dormant** in the rest of these rules. _This doesn't flip foundations!_
            <br><br>
            Next, if any players have more than three active legacies, they discard excess active legacies in turn order, returning them to the legacy deck. _This does not flip foundations!_
            <br><br>
            Finally, shuffle the legacy deck.

              - `symbol:legacy-scepter` Hold the Grand Scepter. _If none, win._
              - `symbol:legacy-sites` Rule the most sites.
              - `symbol:legacy-secret` Hold the Darkest Secret.
              - `symbol:legacy-favor` Hold the People's Favor.
              - `symbol:legacy-suit` Rule the most cards of this suit _(even advisers)_.
              - `symbol:legacy-relic` Hold the relic of the highest value _(shown under name)_.
          children:
            - name: Bandits do not compete for legacy goals.
              text: Only count sites and cards ruled by players.

            - name: If there is no Grand Scepter,
              text: the winner meets the Hold the Grand Scepter legacy goals. _This happens in games without the Chancellor, such as your very first game._

            - name: For legacy goals, Imperial sites are ruled by all Imperials.
              text: Likewise, all Imperials rule the cards at Imperial sites for the purpose of legacy goals.

            - name: Imperials have friendly ties.
              text: If only Imperials are tied for a legacy goal, all those Imperials meet that legacy goal. _As a result, if the Empire rules the most sites, all Imperials meet that goal. Likewise, if Imperials happen to be tied for ruling the most cards of a suit, those players meet that goal._

            - name: Exiles have unfriendly ties.
              text: If any Exiles are tied for a legacy goal, nobody meets that goal. _This happens even if they're tied with the Empire!_

        - name: Second, Crown Chancellor.
          pretext: The winner becomes Chancellor and takes its board, purple pieces, and the Grand Scepter.
          children:
            - name: If an Exile won, the Empire breaks.
              text: The winner's newly dormant legacies become active. The former Chancellor and all Citizens, even in the box, become Exiles. Discard all relics in the Reliquary. Remove all Imperial warbands from sites, but do not add bandits to them. Then, on each site ruled by the winner, replace their warbands with one Imperial warband. _The winner rules these sites throughout the rest of the Chronicle._

            - name: If a Citizen won, a new dynasty begins.
              text: The former Chancellor becomes a Citizen.

        - name: Third, Assign Tasks.
          pretext: The winner takes the Throne task card. The player holding the People's Favor takes the World task card. The player holding the Darkest Secret takes the Beacon task card.
          children:
            - name: If no one holds a banner,
              text: the winner may give its task card to anyone _(even themself)_.

            - name: If the same player holds both the Beacon and World tasks,
              text: they must give the Beacon or World task to someone else.

    - name: 'Task 2: The Throne'
      pretext: The **player holding the Throne task** resolves these steps.
      children:
        - name: First, Offer Citizenship.
          pretext: >
            You may offer Citizenship to any Exiles. If an Exile becomes a Citizen, flip their newly dormant legacies to active, and replace warbands at sites they rule with one Imperial warband on each. _Don't worry about running out—you can take excess Imperial warbands from other sites._
            <br><br>
            If the former Chancellor accepts Citizenship, place one Imperial warband on each site that was previously Imperial. _In other words, place them on sites with no warbands._

        - name: Second, Shape Empire.
          pretext: >
            You may remove any of your warbands from sites, except the last warband of yours on the map. If you don't rule any sites, remove all warbands from the site with your pawn, and place a warband of yours on it.
            <br><br>
            Then, discard denizens **that you don't rule** except for intact edifices.
            <br><br>
            _Ruined edifices that are discarded go to the bottom of the edifice deck._
            <br><br>
            _Cards at Enduring sites are not discarded in Shape Empire._

        - name: Third, Build Edifice.
          pretext: >
            Take the edifice deck out of the box. Find the topmost edifice of each suit and set them aside: these edifices are **available** to build.
            <br><br>
            You may bury a denizen at a site you rule to place the matching available edifice at the site.
            <br><br>
            _You can bury locked `symbol:locked` cards, including edifices! Buried denizens except for edifices go on the bottom of the world deck. Buried edifices go on the bottom of the edifice deck._
            <br><br>
            Shuffle the remaining available edifices back into the edifice deck, and return it to the box.

        - name: Fourth, Stock Reliquary.
          pretext: >
            Add all of the relics you have, except the Grand Scepter, to the Reliquary facedown.
            <br><br>
            Then, if the Reliquary has more than 5 relics, discard relics you choose from it until it has 5.

        - name: Fifth, Scatter Relics.
          pretext: >
            Set aside the Grand Scepter and the Reliquary with its relics.
            <br><br>
            Shuffle together all discarded relics and relics held by players. Deal them facedown to empty relic slots on sites going Hinterward: go top to bottom in the Cradle, then top to bottom in the Provinces, then top to bottom in the Hinterland. Return the rest to the relic deck.

        - name: Sixth, Score Lineage Points.
          pretext: >
            The winner scores 3 lineage points for winning plus points from their legacies: each legacy scores 1 lineage point per matching card at sites they rule. _Do not include advisers._
            <br><br>
            Record the new lineage point scores on the score sheet in this game's column. Circle the Chancellor's score and underline Citizens' scores.
          children:
            - name: The winner may give away lineage points.
              text: Any number of times, they may spend 2 lineage points they are scoring to let another player score 1 lineage point.

            - name: If the era's end condition has been reached,
              text: the player or players with the most lineage points win the era! Once you finish this Chronicle Phase, reset everyone's lineage points to 0 on a new scorepad. _This is all that happens at the end of an era. Nothing else changes!_

        - name: Seventh, Swear an Oath.
          pretext: If a player won by a Vision, set the Oathkeeper goal to match the Vision they won with. Otherwise, choose an Oathkeeper goal that is different from the current one. _You can store this in the plastic tray with favor and secrets._

    - name: 'Task 3: The World'
      pretext: The **player holding the World task** resolves these steps.
      children:
        - name: First, Separate Visions.
          pretext: Gather all 5 Vision cards into a stack and set it aside.

        - name: Second, Gather Denizens.
          pretext: >
            Shuffle together all denizens from the discard piles and players' advisers.
            <br><br>
            Return all but 9 denizens of these to the world deck. _Don't look at the cards yet._
            <br><br>
            Split these 9 denizens into three stacks of 3 denizens each. Flip **two** of these stacks faceup.
            <br><br>
            _In some exceptionally rare situations where there are fewer than 9 denizens, take the difference from the world deck. If this happens, please write to us and explain what went wrong._

        - name: Third, Protect and Dispossess.
          pretext: >
            Choose one faceup denizen stack to protect: Secretly choose 1 denizen as a facedown starting adviser you keep for the next game, and add the other 2 denizens facedown to the world deck.
            <br><br>
            Place the other two stacks, 6 denizens in total, behind the Dispossessed divider in the box.

    - name: 'Task 4: The Beacon'
      pretext: The **player holding the Beacon task** resolves these steps.
      children:
        - name: First, Introduce Newcomers.
          pretext: >
            Choose three different suits and find those denizen stacks in the box. _Do not take from the Dispossessed or Edifices sections._
            <br><br>
            Draw three random denizens of the first suit, two of the second, and one of the third.
            <br><br>
            If there are not enough cards of any desired suit, the Dispossessed return: before drawing, return all cards from the Dispossessed, except the 6 denizens just added by the World, to their respective box sections behind their suited dividers _(Hearth, Order, etc.)_.

        - name: Second, Welcome a Stranger.
          pretext: Look at the drawn denizens. Choose one to keep as a facedown starting adviser for the next game, and add the others facedown to the world deck.

        - name: Third, Shape Foundation.
          pretext: You may flip one foundation setup card from its altered side to its normal side unless it's being altered by an active legacy.

    - name: 'Task 5: The Stars'
      children:
        - name: First, Write in the Stars.
          pretext: >
            The winner draws and names any constellation they would like on the back of the era scorepad. We suggest using 3 to 8 stars near each other.
            <br><br>
            We also encourage your group to record the story of the game however you want, such as by using the supplemental Chronicle Booklet.

        - name: Second, Archive Rival Sites.
          pretext: >
            For each site **not ruled by the winner**, remove any pieces on it, and stack all remaining cards at the site _(relics and intact edifices)_ on top of the site card.
            <br><br>
            Then, stack sites **not ruled by the winner** going Hinterward: go from the top to bottom in the Cradle, then top to bottom in the Provinces, then top to bottom in the Hinterland. _The Cradlemost site that is not ruled by the winner should be at the top._
            <br><br>
            Place the Empire divider on top of this stack, then slide this stack and divider into the Atlas box on its Recent Sites side, so that the stack is on top of the sites already in the Atlas box. _All cards in the Atlas box should face the same way._

        - name: Third, Clean Up.
          pretext: >
            Return all pieces to their banks. _This includes favor, secrets, warbands, and pawns. Basically anything that is not a card or the map._
            <br><br>
            Consolidate all sites ruled by the winner: shift them Cradleward along with all their cards _(denizens, relics)_ so the only empty site slots are Hinterward.

        - name: Fourth, Play Again or Store.
          pretext: 'Decide whether you want to play again now or store the game, as follows:'
          children:
            - name: Store the Empire.
              text: Stack all cards at each site _(denizens, relics)_ on its site card. Then, stack sites with their cards going Hinterward, so the Cradlemost site is on top. Slide this stack into the Atlas box on top of the Empire divider.

            - name: Store players.
              text: Store each of the players' pieces, advisers, and legacies, ensuring that legacies keep their current facing. Store the Chancellor's pieces, Grand Scepter, and Reliquary stack separate from the players.

            - name: Store world deck.
              text: Place the Visions and any denizens on the World Deck slot on the map behind the World Deck divider in the box.

            - name: Store other pieces.
              text: Return any pieces remaining on the table to the box.


- name: Fine Print
  color: '#000000'
  children:
    - name: Interpreting Rules
      pretext: >
        Text in _italics_ is a reminder or clarification, which is superseded by the non-italicized text it references.
        <br><br>
        Powers can add new actions and trigger effects, but they follow Glossary terms. _For example, when you use a power that lets you swap, you must follow the restrictions in the "Swap" Glossary definition._

    - name: The Iron Rule
      pretext: 'Rules disputes may happen at your table that are not immediately answered in this rulebook. If this happens, use the Iron Rule: the Chancellor settles the dispute! If there is no Chancellor, the player with the first player marker settles the dispute instead.'

    - name: Simultaneous Effects
      pretext: If multiple game effects happen simultaneously, the player taking their turn chooses the order.

    - name: Must, If Able, Cannot, and Ignore
      pretext: >
        Rules with "must" override other rules. Rules with "cannot" override other rules, even "must" rules. Rules with "ignore" override "must" and "cannot" rules if those rules are named.
        <br><br>
        _For example, you_ **must** _discard an adviser when playing one above your adviser limit, but the Pied Piper card says to_ **ignore** _the adviser limit, so it supersedes the core rule. Likewise, the "bury" term ignores the locked restriction._
        <br><br>
        If a rule with "must" also says "if able," you must fulfill it if you can, but if you cannot, then you don't have to fulfill it and you're not penalized.

    - name: Component Limits and Capacity
      pretext: >
        Oath is component-limited except for favor, secrets, dice, and bandit warbands. If you are prompted to gain or take components, but the source of that component does not have enough, gain or take as many as possible.
        <br><br>
        Banks and boards can hold any number of a given component unless prompted otherwise.

    - name: Public and Private Information
      pretext: >
        In play, the following information is private: the card backs of cards in the world deck beyond the first, and the card fronts of any facedown cards outside your player area, including in discard piles. **All** other information in play is public. _This includes the card backs and number of cards in discard piles, and favor, secrets, and warbands on boards. You can't change the order of facedown advisers._
        <br><br>
        In the Atlas box, all information is private except the first site on the Recent Sites side and denizens and edifices stored with it. _Not relics!_
        <br><br>
        Cards in the Dispossessed and behind the suited dividers are private.
        <br><br>
        Players may discuss and lie about private information.

    - name: Consent
      pretext: >
        Some effects involve giving or asking for consent from players—in particular, various persistent powers (`rule:9.6`), the Pass (`rule:10.5.6`), and various Imperial Laws (`rule:13.3`).
        <br><br>
        If a player forgets to enforce this need for consent and the turn has continued a reasonable amount, keep playing as if consent was received. However, the bandits always enforce the Pass and persistent powers and never give consent to ignore them.

    - name: Limits on Table Talk
      pretext: >
        We have found that adding the following limits on communication speeds up the game, especially at higher player counts, and gives richer context for negotiations. While your group should decide together whether you want to use these limits, we strongly recommend them.
        <br><br>
        First, communication is public. Players may discuss the game state at any time and remark on their own position and the positions of other players. The active player should generally narrate their actions and describe new cards that are added to the game.
        <br><br>
        Second, players may only communicate with each other directly and coordinate actions while their pawns are at the same site or they are in a negotiation (`rule:8.5`), including remote negotiations from card powers. Promises of future actions are non-binding. Players may always ask for and give consent when prompted by the rules (see above), but this does not let them coordinate freely.
        <br><br>
        Outside of those cases, players cannot coordinate, including asking someone to come to their site for a future negotiation. Citizens in different regions cannot plot the downfall of the Chancellor. While players can kibitz and cajole, they cannot coordinate. You may encounter edge cases that need adjudication—we trust your good judgment.

- name: Glossary
  color: '#000000'
  children:
    - name: Adviser
      pretext: A denizen or Vision in the Advisers area beside a player board.
    - name: After
      pretext: Immediately following—nothing happens between.
    - name: Burn (favor, secret)
      pretext: Move the favor or secret to the shared bank.
    - name: Bury (denizen)
      pretext: Add the denizen to the bottom of the world deck, ignoring the locked restriction. If it's an edifice, return it to the bottom of the edifice deck instead, ignoring the locked restriction.
    - name: Bury (relic)
      pretext: Add the relic to the bottom of the relic deck, ignoring the locked restriction.
    - name: Card
      pretext: Denizen or relic. _Even though sites and legacies are physically cards, you won't interact with them unless they are named explicitly. Sorry this isn't fully intuitive!_
    - name: Cradleward
      pretext: Go from the bottom site to the top site in the Hinterland, then bottom to top in the Provinces, then bottom to top in the Cradle.
    - name: Cradlemost
      pretext: The site closest to the top Cradle site in Cradleward order.
    - name: Discard (denizens except edifices, Visions)
      pretext: Place the cards facedown in an order of your choice on top of the Provinces discard pile if your pawn is in the Cradle, the Hinterland discard pile if your pawn is in the Provinces, or the Cradle discard pile if your pawn is in the Hinterland. If discarding a card in a different region from your pawn, discard based on the region of the card instead. Move favor from the discarded card to the matching favor bank. Move secrets from it to the acting player's board and flip them facedown.
    - name: Discard (edifices)
      pretext: Return the edifice to the bottom of the edifice deck. Move favor from it to the matching favor bank. Move secrets from it to the acting player's board and flip them facedown. _Intact edifices, since they are locked, cannot be discarded._
    - name: Discard (relics)
      pretext: Set the relic aside. Move secrets from it to the acting player's board and flip them facedown. _Discarded relics will return to sites and the relic deck during the Chronicle Phase._
    - name: Dispossessed
      pretext: Denizens that have been removed from play, stored behind the Dispossessed divider in the box. Visions cannot enter the Dispossessed.
    - name: Draw (Card)
      pretext: Take cards from the top of the prompted draw source.
    - name: Empty (Card)
      pretext: A card that has no favor or secrets on it.
    - name: Enemy
      pretext: Other players and the bandits. "Your enemy" refers to your opponent in a campaign. _Some powers using this term must be actively enforced (`rule:9.6.1`)._
    - name: Exchange
      pretext: You may **give** pieces to the prompted player and vice versa.
    - name: Force
      pretext: As the attacker in a campaign, the warbands on your board. As the defender, the warbands that are adding to your defense value.
    - name: Gain (Favor)
      pretext: Place favor onto your board from the prompted favor bank. _Some powers will explicitly state to gain favor from the shared bank instead._
    - name: Gain (Secrets)
      pretext: Place secrets onto your board from the shared bank.
    - name: Gain (Warbands)
      pretext: Place warbands onto your board from your warband bank.
    - name: Give
      pretext: Same as **take**, but in the reverse direction. _Powers that stop players from taking a thing do not also stop them from giving!_
    - name: Hinterward
      pretext: Go from the top site to the bottom site in the Cradle, then top to bottom in the Provinces, then top to bottom in the Hinterland (`rule:4.3`).
    - name: Hintermost
      pretext: The site closest to the bottom Hinterland site in Hinterward order.
    - name: Imperial Player
      pretext: The Chancellor and Citizens. "Imperial" is sometimes used as shorthand for Imperial player.
    - name: Kill (Warband)
      pretext: Move the warband to the warband bank of the player of the same color. If it's a purple Imperial warband, move it to the Chancellor's warband bank. If it is a bandit, move it to the shared bank.
    - name: Locked (Card)
      pretext: The card cannot be discarded, swapped, flipped, or moved. **Bury** _ignores this._
    - name: Matching (Card)
      pretext: Has the same suit.
    - name: Move
      pretext: Change the location of the piece, following restrictions (`rule:9.2`).
    - name: Peek (at Card)
      pretext: Look at the front of the card. No one else looks at it.
    - name: Play
      pretext: Put the prompted card at a site, in your advisers, or in your play area, following restrictions (`rule:9.2`).
    - name: Play Area
      pretext: The pieces held by a specific player—their player board and pieces on it, their Advisers area, relics, banners, legacies, etc.
    - name: Replace (Warband)
      pretext: Swap the warbands with prompted warbands of a new color. By default, these warbands come from and return to their respective warband banks, not sites. This is distinct from **kill** and **sacrifice**.
    - name: Reveal (Card)
      pretext: Flip the card faceup. This does not trigger When Played powers.
    - name: Rule (Site)
      pretext: A site is ruled by the player, or the bandits, who has any number of warbands on it.
    - name: Rule (Powers)
      pretext: A player rules all denizens at sites that they rule, and rules everything in their play area—their advisers, relics, banners, legacies, and Oathkeeper title.
    - name: Sacrifice (Warband)
      pretext: Kill your own warband.
    - name: Shared Bank
      pretext: Pieces that are in play, not on the map, and not in a play area. _Examples include secrets and banners not held by players._
    - name: Starting Adviser
      pretext: Advisers gained through Foundation IV, the Beacon, the World, or powers that use the term such as the Oaths of Loyalty legacy. These start facedown unless revealed at the end of setup.
    - name: Swap (Card)
      pretext: Move two cards to each other's location simultaneously.
    - name: Take
      pretext: Move the favor or secrets to your board, the denizens or facedown visions to your Advisers area, or the relics or banners to your play area. _This term is often found on powers that take things from other players._
    - name: Warband Bank
      pretext: >
        The collection of your warbands beside your player board. If you are a Citizen, it is the collection beside the Chancellor's board.
        <br><br>
        _Generally, this holds all of your warbands that are not on your player board or the map. Even though the Chancellor holds the purple warband bank, it acts as the warband bank for all Imperials._
    - name: You Have / You Hold (Pieces)
      pretext: Shorthand for the pieces in your **play area**.
    - name: Your Site/Region
      pretext: The site or region that your pawn is in.